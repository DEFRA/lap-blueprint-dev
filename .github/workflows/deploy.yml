name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Copy GOV.UK assets
        run: npm run copy:govuk-assets

      - name: Set environment variable for dev site
        if: ${{ vars.IS_DEV_SITE == 'true' }}
        run: |
          echo "IS_DEV_SITE=true" >> $GITHUB_ENV
          echo "User-agent: *" >> public/robots.txt
          echo "Disallow: /" >> public/robots.txt
          sed -i 's|/lap-blueprint/|/lap-blueprint-dev/|g' src/styles/global.scss

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
